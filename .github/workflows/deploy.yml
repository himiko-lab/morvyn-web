name: Deploy ke GitHub Pages

# Setiap push ke main membangun ulang situs dan menerbitkannya.
# Bisa juga dijalankan manual dari tab Actions lewat "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Kalau ada dua push berdekatan, biarkan yang sedang berjalan selesai dulu
# daripada dibatalkan — deploy yang terputus di tengah bisa meninggalkan
# situs dalam keadaan setengah jadi.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Sengaja `npm install`, bukan `npm ci`.
      #
      # npm memangkas package-lock.json menurut platform tempat lock itu
      # dibuat. Lock ini dibuat di macOS/arm64, sehingga cabang milik paket
      # *-wasm32-wasi (@emnapi/core, @emnapi/runtime) tidak ikut tercatat —
      # paket-paket itu tidak berlaku di macOS. Runner ini Linux, npm
      # membutuhkannya, lalu `npm ci` menolak jalan karena lock dianggap tidak
      # sinkron. Membuat ulang lock di macOS tidak menyelesaikannya: satu
      # berkas lock tidak bisa memuaskan `npm ci` di macOS dan Linux sekaligus.
      #
      # `npm install` tetap menghormati versi yang sudah terkunci di lock dan
      # hanya menambal bagian yang hilang untuk platform ini — bukan `npm
      # update`, jadi versinya tidak melompat.
      - run: npm install

      # Menghasilkan folder out/ karena next.config.ts memakai output: "export".
      - run: npm run build

      # Tanpa berkas ini, GitHub Pages menjalankan Jekyll, dan Jekyll membuang
      # semua folder berawalan garis bawah — termasuk _next/, yang berisi
      # seluruh CSS dan JavaScript situs ini.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
