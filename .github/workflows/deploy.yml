name: Deploy ke GitHub Pages

# Setiap push ke main membangun ulang situs dan menerbitkannya.
# Bisa juga dijalankan manual dari tab Actions lewat "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Kalau ada dua push berdekatan, biarkan yang sedang berjalan selesai dulu
# daripada dibatalkan — deploy yang terputus di tengah bisa meninggalkan
# situs dalam keadaan setengah jadi.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` memasang persis apa yang tercatat di package-lock.json,
      # jadi hasil build di sini sama dengan di mesin lokal.
      - run: npm ci

      # Menghasilkan folder out/ karena next.config.ts memakai output: "export".
      - run: npm run build

      # Tanpa berkas ini, GitHub Pages menjalankan Jekyll, dan Jekyll membuang
      # semua folder berawalan garis bawah — termasuk _next/, yang berisi
      # seluruh CSS dan JavaScript situs ini.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
